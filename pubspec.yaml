name: vien
description: "English learning offline app with CEFR dictionary and adaptive review."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  provider: ^6.1.5+1
  go_router: ^18.1.0
  flutter_local_notifications: ^22.3.2
  intl: ^0.20.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/seed/tags/
    - assets/seed/headwords/
    - assets/seed/phrases/
    - assets/seed/questions/
