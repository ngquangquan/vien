name: vien
description: "English learning offline app with CEFR dictionary and adaptive review."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  provider: ^6.1.5+1
  go_router: ^18.1.0
  flutter_local_notifications: ^22.3.2
  intl: ^0.20.3
  timezone: ^0.11.2
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/seed/tags/
    - assets/seed/headwords/
    - assets/seed/phrases/
    - assets/seed/questions/
    - assets/icon/
